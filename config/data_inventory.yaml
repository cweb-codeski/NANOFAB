# Classification of existing data files relevant to the passive device model.
# Read by nanofab.device.case.preflight, which reports presence and hashes at run time.
# data_role values: PHYSICAL_CELL_CALCULATION, LITERATURE_DIGITIZATION, ANALYTICAL_EXAMPLE,
# MANUFACTURED_FIXTURE, plus PROPERTY_TABLE / SYNTHETIC_PARSER_EXAMPLE / STORED_DERIVED_RESULT for
# files outside the cell-table contract. Relabeling a file here never promotes it.

permeability_stage1_flow_processed:
  path: data/processed/permeability_stage1_flow.csv
  data_role: STORED_DERIVED_RESULT
  classification: "stored derived COMSOL result with incomplete provenance (not synthetic)"
  content: >
    Four flat-interface (Pc = 0) mesh levels, hmax 2.0/1.0/0.7/0.5 um, single imposed 1 Pa drop
    over a quarter cell (ell = l/2 = 15 um, gradient ~6.7e4 Pa/m). Finest K = 2.9698e-11 m^2;
    last-pair change ~0.102%.
  qualified_for_prediction: false
  reasons:
    - "flat interface only: no pressure dependence K(Pc), no meniscus states"
    - "single low gradient (~6.7e4 Pa/m) vs device feed gradients of order 1e5-1e6 Pa/m; gradient independence not demonstrated"
    - "no Stokes vs Navier-Stokes comparison"
    - ".mph model, selections and complete setup evidence are not tracked"

stage1_flow_raw_local:
  path: data/comsol_exports/stage1_flow.csv
  data_role: STORED_DERIVED_RESULT
  classification: "local raw COMSOL export (gitignored); metadata names permeability1.mph, COMSOL 6.3.0.420"
  qualified_for_prediction: false
  reasons:
    - "same flat-interface, single-gradient limitations as the processed table"
    - "the referenced .mph model is not present in the repository"
    - "note in the header says it is the corrected third column pair of a larger export held outside the repository"

stage1_student_reported:
  path: data/reported/stage1_student_reference_d10_l30_h25.csv
  data_role: REPORTED_RESULT
  classification: "undergraduate's independent Stage 1 build, transcribed from a report (REPORTED_UNVERIFIED)"
  content: >
    hmax 2/1/0.5/0.25 um; finest K = 2.9711e-11 m^2; last change 5.05e-4 (coarser denominator).
    Agrees with permeability_stage1_flow_processed within 0.05% at matching meshes
    (analysis/stage1_crosscheck.py).
  qualified_for_prediction: false
  reasons:
    - "no raw export, .mph, selections, viscosity, dp or BC record"
    - "same flat-interface, single-gradient limitations as the stored Stage 1 result"

stage2_chase_reported:
  path: data/reported/stage2_chase_reported_columns.csv
  data_role: REPORTED_RESULT
  classification: "Chase's Stage 2 text-export values (stage2_flat_interface.mph, COMSOL 6.3.0.420), transcribed"
  content: "two Q_in columns (1.125e-4 W) and two T_base columns (381.19638568455605, 381.21757382818055 K)"
  qualified_for_prediction: false
  reasons:
    - "columns carry no mesh, dataset or selection identifiers: not successive meshes, not to be averaged"
    - "no Q_evap in the report, so no energy balance"
    - "Q_in equals the q0*(l/2)^2 input echo"

stage2_assembled_local:
  path: data/comsol_exports/stage2_flat_d10_l30_h25.txt
  data_role: STORED_DERIVED_RESULT
  classification: "local file (gitignored) assembled from four exported tables; row order and Q_evap column choice were INFERRED"
  qualified_for_prediction: false
  reasons:
    - "header states that the coarser/finer row labels were inferred from meniscus area (hmax not exported)"
    - "model-file inspection (data/reported/stage2_chase_identified_from_model_file.md): row 1 = automatic-mesh solution, row 2 = Study 2/Solution 1 after the hmax sweep (probably 0.25 um); not a sweep pair"
    - "row-2 Q_evap = integral of ht.ntflux on the Robin boundary, which equals hi*(T-Tv) exactly (implied hi 4.200000e5): an identity, not a flux-based balance"
    - "pillar trimming confirmed from the geometry sequence; T_base selection (boundaries 6, 10) area still unchecked"

stage2_raw_tables_local:
  path: data/comsol_exports/stage2_raw_chase/
  data_role: STORED_DERIVED_RESULT
  classification: "unmodified copies of Chase's four Stage 2 tables from D:/NANOFAB/COMSOL (gitignored); hashes in data/reported/stage2_chase_identified_from_model_file.md"
  qualified_for_prediction: false
  reasons:
    - "evaluated on Study 2/Solution 1 only; the four hmax sweep solutions were not evaluated"
    - "Q_in is the q0*(l/2)^2 echo; no A_base or interior-plane flux"

vaartstra2019_thesis_fig7:
  path: data/literature/vaartstra2019_thesis_fig7_digitized.csv
  data_role: LITERATURE_DIGITIZATION
  classification: "PROJECT_DERIVED digitization of the authors' calculated q''_e(dT) at a = 0.052 (thesis p. 23)"
  qualified_for_prediction: false
  reasons: ["implementation check of the evaporation law at one accommodation value; not experimental data"]

h_evap_stage2_processed:
  path: data/processed/h_evap_stage2_flat_d10_l30_h25.csv
  data_role: STORED_DERIVED_RESULT
  classification: "h = 6.2e4 W/m^2K derived from stage2_assembled_local (untracked local file)"
  qualified_for_prediction: false
  reasons:
    - "inherits the inferred row labels and column choice of stage2_assembled_local"
    - "flat interface, linearized ASSUMED closure: not comparable with vaartstra2019 h_e (> 60 kW/m^2K) despite the similar number"

permeability_stage1_flow_example:
  path: data/processed/permeability_stage1_flow_example.csv
  data_role: SYNTHETIC_PARSER_EXAMPLE
  classification: "processed output of the SYNTHETIC parser example (untracked local file)"
  qualified_for_prediction: false
  reasons: ["derived from data/comsol_exports/examples/stage1_flow_example.csv, which is SYNTHETIC"]

comsol_examples:
  path: data/comsol_exports/examples/
  data_role: SYNTHETIC_PARSER_EXAMPLE
  classification: "explicitly SYNTHETIC parser examples"
  qualified_for_prediction: false
  reasons: ["synthetic by declaration"]

vaartstra2019_analytical_comparison:
  path: data/processed/vaartstra2019_analytical_comparison.csv
  data_role: ANALYTICAL_EXAMPLE
  classification: "approximate analytical estimates with ASSUMED feed lengths and unmatched validation geometries"
  qualified_for_prediction: false
  reasons: ["legacy analytical sanity output, not a cell-response table"]

psat_water:
  path: data/processed/psat_water.txt
  data_role: PROPERTY_TABLE
  classification: "saturation-pressure property table for COMSOL interpolation, not a cell-response table"
  qualified_for_prediction: false
  reasons: ["not a cell table"]

vaartstra2019_targets:
  path: data/literature/vaartstra2019_targets.csv
  data_role: LITERATURE_DIGITIZATION
  classification: "reported scalar targets plus empty planned digitizations"
  qualified_for_prediction: false
  reasons: ["comparison targets only; blank planned digitization rows are not data"]
