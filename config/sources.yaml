# Source registry. Every `source:` id used in parameters/*.yaml, config/model_provenance.yaml and
# data/literature/*.csv must be a key in this file (enforced by tests/test_provenance.py).
#
# Fields
#   type:                   provenance class of the source itself (see docs/SOURCE_AUTHORITY.md)
#   role:                   optional project role, e.g. PRIMARY_MODEL_REFERENCE
#   bibliography_verified:  how the citation details were checked:
#                             pdf            - read from the PDF we hold
#                             reference_list - copied from a reference list in a PDF we hold
#                             no             - written from memory, NOT checked; treat as TODO
#   content_verified:       true only if we have read the part of the source our values rely on
#   local_path:             where the PDF lives (research PDFs are kept outside the repo)
# Unknown details are written as "unknown" or TODO, never guessed.

# ---------------------------------------------------------------------------------------------
# Primary model reference and closely related Wang-group work (PDFs held)
# ---------------------------------------------------------------------------------------------

vaartstra2019:
  title: "Simultaneous prediction of dryout heat flux and local temperature for thin film evaporation in micropillar wicks"
  authors: ["Geoffrey Vaartstra", "Zhengmao Lu", "Evelyn N. Wang"]
  year: 2019
  venue: "International Journal of Heat and Mass Transfer 136 (2019) 170-177"
  doi: "10.1016/j.ijheatmasstransfer.2019.02.074"
  type: PRIMARY_SOURCE
  role: PRIMARY_MODEL_REFERENCE
  scope: [micropillar_geometry, capillary_pressure, permeability, meniscus_shape, evaporation_model,
          dryout, device_scale_model, mesh_convergence]
  bibliography_verified: pdf
  content_verified: true
  local_path: "C:/Users/chase/Downloads/NANOFAB PROJECT RESEARCH/research documents/research papers/Simultaneous prediction of dryout heat flux and local temperature for.pdf"
  notes: >
    Primary authority for the baseline replication: geometry, unit-cell and device model
    equations, boundary conditions, assumptions (App. A.1), replication targets, mesh convergence.
    Does not state silicon conductivity or the source of water properties. Used COMSOL 5.3a
    (ref. [25]). PDF text extraction drops minus signs in exponents (e.g. Table A1, A.1).

vaartstra2019_thesis:
  title: "Comprehensive modeling of thin film evaporation in micropillar wicks"
  authors: ["Geoffrey Vaartstra"]
  year: 2019
  venue: "M.S. thesis, Department of Mechanical Engineering, Massachusetts Institute of Technology (June 2019), 52 pp."
  doi: unknown
  type: PRIMARY_SOURCE
  role: SUPPORTING_MODEL_REFERENCE
  scope: [micropillar_geometry, capillary_pressure, permeability, meniscus_shape, evaporation_model,
          dryout, device_scale_model, mesh_convergence, system_cooling]
  bibliography_verified: pdf
  content_verified: partial
  local_path: "C:/Users/chase/Downloads/NANOFAB PROJECT RESEARCH/research documents/research papers/comprehensive modeling of thin film evaporation in micropillar wicks.pdf"
  notes: >
    Thesis version of vaartstra2019 (cites it as ref. [46]). Not peer reviewed; ranks below the
    IJHMT paper. Adds an optimization table (Table 1, T_sat = 50 C), a compact thermal model and
    future-work chapters. Text extraction drops superscripts; checked items were read from
    rendered page images. Checked: Re_h ~ 10^1 (p. 23, 51); heat input 1 um below pillar base
    (p. 20); T_e red line at substrate top (Fig. 4b, p. 20); c4* = -2.13204, d4* = -0.44675
    (p. 22). Confirmed NOT stated: silicon properties, water property source, the
    Meland-Ytrehus correction form, Sangani-Acrivos.

vaartstra2020:
  title: "Capillary-fed, thin film evaporation devices"
  authors: ["Geoffrey Vaartstra", "Lenan Zhang", "Zhengmao Lu", "Carlos D. Diaz-Marin", "Jeffrey C. Grossman", "Evelyn N. Wang"]
  year: 2020
  venue: "Journal of Applied Physics 128, 130901 (2020) (Perspective)"
  doi: "10.1063/5.0021674"
  type: PRIMARY_SOURCE
  role: REVIEW
  scope: [capillary_pressure, permeability, evaporation_model, dryout, device_scale_model, system_cooling, fluid_properties]
  bibliography_verified: pdf
  content_verified: partial
  local_path: "C:/Users/chase/Downloads/NANOFAB PROJECT RESEARCH/research documents/research papers/Capillary-fed, thin film evaporation devices.pdf"
  notes: >
    Review/perspective. Primary for its own Fig. 8 model; for values it compiles from others,
    cite the original. States the accommodation-coefficient range for water (0.001-1, Sec. III C)
    and uses k_Si = 153 W/m/K at 20 C (citing Lienhard).

zhou_adera2026:
  title: "Numerical Simulation and Optimization of Thin-Film Evaporation in Variable Micropillar Wicks"
  authors: ["Yimin Zhou", "Solomon Adera"]
  year: 2026
  venue: "ASME Journal of Heat and Mass Transfer 148(3), 031604 (2026)"
  doi: "10.1115/1.4070734"
  type: PRIMARY_SOURCE
  scope: [micropillar_geometry, capillary_pressure, permeability, meniscus_shape, dryout, device_scale_model]
  bibliography_verified: pdf
  content_verified: partial
  local_path: "C:/Users/chase/Downloads/NANOFAB PROJECT RESEARCH/research documents/research papers/Numerical simulation and Optimization of thin-film evaporation in variable micropillar wicks.pdf"
  notes: >
    Independent dryout model (no temperature/HTC). Reports 84 W/cm2 for d=10, l=30, h=25 um at
    1 atm (vs 82 W/cm2 in vaartstra2019): a cross-check, not a replacement. Uses theta_rec = 15 deg.
    Novel variable-diameter wicks: relevant to Phase 5. Supplemental material not held.

