pujahari2022:
  title: "Electro-osmosis Aided Thin-Film Evaporation from a Micropillar Wick Structure"
  authors: ["Ankita Pujahari", "Sunando DasGupta", "Anandaroop Bhattacharya"]
  year: 2022
  venue: "Langmuir 38 (2022) 8442-8455"
  doi: "10.1021/acs.langmuir.2c01048"
  supporting_information_doi: "10.1021/acs.langmuir.2c01048.s001"
  supporting_information_url: "https://acs.figshare.com/articles/journal_contribution/Electro-osmosis_Aided_Thin-Film_Evaporation_from_a_Micropillar_Wick_Structure/20201943"
  type: PRIMARY_SOURCE
  role: ELECTROOSMOSIS_REFERENCE
  scope: [device_scale_model, electro_osmosis, fluid_properties]
  bibliography_verified: pdf
  content_verified: partial
  access_status: "article PDF HELD and read (text extraction; equations partly garbled); Supporting Information NOT HELD"
  local_path: "C:/Users/chase/Downloads/NANOFAB PROJECT RESEARCH/research documents/research papers/electro osmosis aided thin film evaporation from a micropillar wick structure.pdf"
  notes: >
    Numerical study (COMSOL Poisson-Boltzmann + Navier-Stokes with rho_e E body force per unit
    cell, linked cell-by-cell in MATLAB). Used by src/nanofab/electroosmosis/ for: KCl-water at
    1e-4 and 1e-6 M with zeta = -100 and -200 mV (Sec. 2.1.1, taken from Mala et al. 1997, ref.
    39, not held); Debye lengths 0.03 and 0.3 um (Sec. 3.2); E = 5e3-1e5 V/m along the wick
    (Sec. 2.1.2); Table 1 properties at 100 C (eps_r 55.4, sigma_e 0.79 uS/cm, mu 2.822e-4 Pa s);
    reported dryout gains (Sec. 3.4, Conclusions); Fig. 6 digitized to
    data/literature/pujahari2022_fig6_digitized.csv. Working fluid: dilute aqueous KCl with
    water-like properties (end of Sec. 2.1.4). Calls the EO-enhanced quantity an "effective
    permeability" (Sec. 3.3). AUDIT NOTES: (1) E is imposed as a uniform x-field per unit cell
    (Eq. 8 is 1D); electrodes are not modeled, only "the negative electrode ... on the opposite
    side of the liquid reservoir" (Sec. 2). The paper states the voltages are far below the
    electrolysis voltage (Sec. 2.1.2) and that the field should not cause electrolysis (Sec. 3.5).
    Converting E to a bulk drop over the 5 mm wick (25-500 V) is our extrapolation, and if valid it
    is hard to reconcile with Sec. 2.1.2. (2) One conductivity (0.79 uS/cm) for both
    concentrations: plausible for 1e-6 M, ~50x low for 1e-4 M; no effect on the hydraulics. (3) No
    ion conservation: KCl enriches toward the evaporating end; precipitation is discussed only
    after complete liquid loss (Sec. 3.5). (4) No field-effect change of zeta through the oxide.
    (5) Their EO flux is 0.52-0.69 of mu_EO E / F (from Fig. 6), consistent in size with a
    uniform imposed field at insulating pillar walls (our hypothesis, unconfirmed). These are model
    inputs and results of a simulation paper, not measurements at our conditions.

