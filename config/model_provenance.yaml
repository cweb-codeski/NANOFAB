interpretations:
  T_e_is_pillar_base_plane_average:
    provenance: PROJECT_DERIVED
    source: vaartstra2019_thesis
    source_location: "Fig. 4(b) and caption, p. 20 (= vaartstra2019 Fig. 2b)"
    verified: true
    notes: >
      The red line in the drawing runs along the top of the substrate at the pillar base, under
      the liquid. The text never names the surface, so this stays a figure reading (PROJECT_DERIVED),
      but it is no longer in doubt.
  Re_h_exponent_positive:
    provenance: PRIMARY_SOURCE
    source: vaartstra2019_thesis
    source_location: "Sec. 2.2.1, p. 23; Appendix, p. 51 ('Re_h = rho u h/mu ~ 10^1')"
    verified: true
    notes: "Read from rendered page images. The IJHMT PDF text ('10 1') was ambiguous; consistent with our MODEL_CALCULATED ~16."
  K_gap_due_to_curvature:
    provenance: PROJECT_DERIVED
    source: vaartstra2019
    source_location: "Sec. 2.2 (qualitative: curvature lowers K)"
    verified: false
    notes: "The 19% figure is ours. Analytical K error and non-uniform evaporation are alternative contributors."
  narayanan_average_heat_flux:
    provenance: PROJECT_DERIVED
    source: narayanan2024_interpack
    source_location: null
    verified: false
    notes: "~77 W/cm2 = 700 W TDP / ~9.1 cm2 die area; the paper does not print a heat flux."

