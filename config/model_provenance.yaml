# Provenance of model elements that are not numeric inputs: equations, boundary conditions,
# interpretations, and derived results quoted in docs or script output.
# Same fields as parameters/*.yaml (value optional). `verified` = we checked the cited location.
# Source ids must exist in config/sources.yaml (tests/test_provenance.py).

equations:
  young_laplace:
    provenance: PRIMARY_SOURCE
    source: vaartstra2019
    source_location: "Eq. (1)"
    verified: true
    notes: "Delta p = 2 sigma H; Bo ~ 1e-5 justifies it (A.1)."
  meniscus_normal_stress_balance:
    provenance: PRIMARY_SOURCE
    source: vaartstra2019
    source_location: "Eq. (2), Sec. 2.1"
    verified: true
    notes: "Solved in COMSOL with z = 0 at pillar edges and symmetry at cell boundaries."
  pillar_dryout_capillary_pressure:
    provenance: PRIMARY_SOURCE
    source: vaartstra2019
    source_location: "Eq. (3)"
    verified: true
    notes: "Implemented in capillary.pillar_max_capillary_pressure (algebraically identical). Origin commonly credited to xiao2010 (not checked)."
  evaporative_htc_definition:
    provenance: PRIMARY_SOURCE
    source: vaartstra2019
    source_location: "Eq. (4)"
    verified: true
  linearized_bte_interface:
    provenance: PRIMARY_SOURCE
    source: vaartstra2019
    source_location: "Eqs. (5)-(7)"
    verified: true
    notes: "IJHMT text shows 2.13204 / 0.44675; the thesis (Sec. 2.2.1, p. 22) prints c4* = -2.13204, d4* = -0.44675. Same physics: evaporation.py uses magnitudes with an explicit minus sign."
  accommodation_correction_form:
    provenance: ASSUMED
    source: meland_ytrehus2003
    source_location: null
    verified: false
    notes: "C4(a) = C4* + 2 sqrt(pi)(1 - a)/a in evaporation.sone_bte_mass_flux. Neither vaartstra2019 nor the thesis (p. 22) prints the form; both only cite the method. Not checked against meland_ytrehus2003."
  darcy_law:
    provenance: PRIMARY_SOURCE
    source: vaartstra2019
    source_location: "Eq. (8)"
    verified: true
  volumetric_evaporation_sink:
    provenance: PRIMARY_SOURCE
    source: vaartstra2019
    source_location: "Eq. (9)"
    verified: true
  schrage_relation:
    provenance: ASSUMED
    source: schrage1953
    source_location: null
    verified: false
    notes: "Not used by vaartstra2019. Year discrepancy 1953 vs 1954 (vaartstra2019 ref. [22])."
  sangani_acrivos_permeability:
    provenance: ASSUMED
    source: sangani_acrivos1982
    source_location: null
    verified: false
    notes: "Series coefficients written from memory (drummond_tahir1984 form). Check before relying on K to better than ~30%."
  brinkman_height_correction:
    provenance: PROJECT_DERIVED
    source: brinkman1949
    source_location: null
    verified: false
    notes: "Closed-form height average derived by us from the Brinkman equation. Previously cited to an unverified 'Byon et al. 2014'."
  one_d_capillary_dryout:
    provenance: PROJECT_DERIVED
    source: faghri_heatpipe
    source_location: null
    verified: false
    notes: "Standard 1D Darcy capillary limit, derived by us; uniform evaporation and uniform K."
  spreading_resistance:
    provenance: ASSUMED
    source: lee1995_spreading
    source_location: null
    verified: false
  helmholtz_smoluchowski_mobility:
    provenance: ASSUMED
    source: kirby2010
    source_location: null
    verified: false
    notes: "mu_EO = -eps zeta / mu (thin EDL). Textbook relation cited from memory; pujahari2022 Sec. 1 refers to the HS slip formulation (dutta_beskok2001)."
  eo_similitude_superficial_velocity:
    provenance: ASSUMED
    source: cummings2000
    source_location: null
    verified: false
    notes: "U_EO = mu_EO E / F for uniform zeta, insulating solid, thin EDL, no surface conduction. Leading-order F (Maxwell 2D) verified numerically in electroosmosis.formation_factor."
  eo_darcy_superposition_and_dryout_gain:
    provenance: PROJECT_DERIVED
    source: pujahari2022
    source_location: "problem set-up of Sec. 2 (feed at x = 0, closed end, E along x)"
    verified: false
    notes: "U = (K/mu)(-dp/dx) + U_EO and G(Pi) = (1 + Pi + sqrt(1 + 2 Pi))/2 derived by us (docs/electroosmosis_model.md); verified against an independent FV solve."

